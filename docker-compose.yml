version: '3.8'

services:
  # FIXORA Frontend UI (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
      - "80:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend

  # FIXORA Core Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fixora:fixora_secure_pass@postgres:5432/fixora_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - postgres
      - redis
      - qdrant

  # Application Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fixora
      - POSTGRES_PASSWORD=fixora_secure_pass
      - POSTGRES_DB=fixora_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Job Queue & Real-time PubSub
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Vector Database for Code & Documentation RAG
  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
