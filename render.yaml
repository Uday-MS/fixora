# ==============================================================================
# Render Infrastructure Blueprint for FIXORA
# Autonomous Code Repair and Incident Intelligence Platform
# Reference: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FIXORA Backend Web Service (FastAPI REST API Gateway)
  # ----------------------------------------------------------------------------
  - type: web
    name: fixora-api
    runtime: python
    region: oregon
    plan: free # Can be upgraded to 'starter' for 0ms cold starts & persistent RAM
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fixora-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: https://fixora-ui.onrender.com
      - key: FRONTEND_URL
        value: https://fixora-ui.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: SANDBOX_WORKER_URL
        sync: false
      - key: SANDBOX_WORKER_TOKEN
        sync: false

  # ----------------------------------------------------------------------------
  # 2. FIXORA Frontend Static Site (React 19 + TypeScript + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: fixora-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fixora-api-a2an.onrender.com/api

databases:
  # ----------------------------------------------------------------------------
  # 3. FIXORA Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: fixora-postgres
    region: oregon
    plan: free # or 'starter'
    databaseName: fixora
    user: fixora
